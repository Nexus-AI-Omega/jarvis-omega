name: AntiCheat
version: '1.0.0-OMEGA'
main: de.jarvisomega.anticheat.AntiCheatPlugin
api-version: '1.21'
authors: [Nexus-AI-Omega & JARVIS]
description: 'Anti-Cheat mit Fly-Erkennung und Auto-RAM'
commands:
  anticheat:
    description: 'Hauptbefehl fuer AntiCheat (generiert von J.A.R.V.I.S. OMEGA)'
    usage: '/anticheat <status|heal|ram|shield|idea|support>'
    permission: anticheat.use
permissions:
  anticheat.admin:
    description: 'Voller Admin-Zugriff auf AntiCheat'
    default: op
  anticheat.use:
    description: 'Standard-Zugriff fuer Spieler'
    default: true
